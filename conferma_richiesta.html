<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richiesta Inviata - Dott.ssa Violo</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css"> <style>
        /* Stile specifico per questa pagina per centrare tutto */
        body {
            background-color: #FBF3E4;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .thank-you-card {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(102, 128, 115, 0.15); /* Ombra verde leggera */
            max-width: 500px;
            width: 90%;
            border-top: 6px solid #668073; /* Tocco di classe in alto */
            animation: fadeIn 0.8s ease-out;
        }

        .icon-box {
            font-size: 60px;
            color: #668073;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #1A2621;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .btn-home {
            display: inline-block;
            background-color: #668073;
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 128, 115, 0.3);
        }

        .btn-home:hover {
            background-color: #1A2621;
            transform: translateY(-2px);
        }

        /* Animazione di comparsa */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <div class="icon-box">
            <i class='bx bx-check-circle'></i>
        </div>
        
        <h1>Richiesta Inviata!</h1>
        
        <p>
            Grazie per aver prenotato.<br>
            Ho ricevuto la tua richiesta e ti ho appena inviato una mail di riepilogo.<br><br>
            <strong>Controlla la tua casella di posta</strong> (anche nello spam): riceverai presto la conferma definitiva.
        </p>

        <a href="index.html" class="btn-home">Torna alla Home</a>
    </div>

</body>
</html>
